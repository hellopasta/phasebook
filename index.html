<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phasebook</title>
<link rel="icon" type="image/png" href="phasebook.ico">
<style>
  :root {
    --bg: #31558f;
    --fg: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    min-height: 100vh;
    padding: 4px 4px 40px;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
  }

  .logo {
    display: block;
    width: min(220px, 52vw);
    height: auto;
  }

  main {
    width: min(320px, 100%);
    margin: 57px 0 0;
  }

  .message {
    margin: 0;
    font-size: clamp(30px, 6vw, 32px);
    line-height: 1.22;
  }

  .discord-button {
    display: inline-block;
    margin-top: 16px;
    padding: 7px 18px;
    border: 2px outset #dfdfdf;
    border-radius: 0;
    background: #c0c0c0;
    box-shadow: 1px 1px 0 #000000;
    color: #000000;
    font-family: Tahoma, Arial, sans-serif;
    font-size: 13px;
    font-weight: 400;
    text-decoration: none;
    white-space: nowrap;
  }

  .discord-button:hover {
    background: #d4d0c8;
  }

  .discord-button:focus-visible {
    outline: 1px dotted #000000;
    outline-offset: -5px;
  }

  .discord-button:active {
    border-style: inset;
    box-shadow: inset 1px 1px 0 #808080;
  }

  @media (max-width: 420px) {
    main {
      margin-top: 54px;
    }
  }
</style>
</head>
<body>
  <header class="page-header">
    <img class="logo" src="Phasebook2.png" alt="phasebook">
  </header>

  <main>
    <p class="message">aha, well well well,<br>looks like ur not<br>patient</p>
    <a class="discord-button" href="https://discord.gg/JMv22evyKM" target="_blank" rel="noopener noreferrer">Join Discord</a>
  </main>
</body>
</html>
