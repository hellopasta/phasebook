<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phasebook</title>
<link rel="icon" type="image/png" href="phasebook.ico">
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background: var(--bg);
  }

  .logo-wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
  }

  .logo {
    display: block;
    margin: 0;
    padding: 0;
    width: 100%;
    height: auto;
    line-height: 0;
    transform: translateY(-8px);
  }

  .logo svg {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <h1 class="logo" aria-label="phasebook">
      <svg viewBox="0 0 1800 560" role="img" aria-labelledby="logoTitle" xmlns="http://www.w3.org/2000/svg">
        <title id="logoTitle">phasebook</title>
        <text x="-18" y="360"
              fill="#ffffff"
              font-size="520"
              font-family="Arial Black, Impact, sans-serif"
              font-weight="900"
              letter-spacing="-18">phasebook</text>
      </svg>
    </h1>
  </div>
</body>
</html>
