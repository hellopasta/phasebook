<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phasebook</title>
<link rel="icon" type="image/png" href="phasebook.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000000; }
  body {
    min-height: 100vh;
    color: #ffffff;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    overflow: hidden;
  }

  .logo {
    display: block;
    margin: 90px 0 0 0;
    padding: 0;
    width: 100%;
    max-width: 100vw;
    height: auto;
    line-height: 0;
  }

  .logo svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .message {
    font-family: "Marcellus", "Optima", "Candara", serif;
    font-size: 29px;
    line-height: 1.3;
    letter-spacing: 0.3px;
    width: 265px;
    margin: 40px 0 0 98px;
  }

  .discord-button {
    display: inline-block;
    box-sizing: border-box;
    margin: 0 0 0 98px;
    padding: 6px 12px;
    border: 2px solid;
    border-color: #ffffff #404040 #404040 #ffffff;
    background: #c0c0c0;
    color: #000000;
    font: 16px Arial, sans-serif;
    text-decoration: none;
    text-shadow: 1px 1px #ffffff;
    cursor: pointer;
  }
  .discord-button:hover { background: #d4d4d4; }
  .discord-button:active {
    border-color: #404040 #ffffff #ffffff #404040;
    padding: 7px 11px 5px 13px;
  }
  .discord-button:focus-visible { outline: 1px dotted #000000; outline-offset: -5px; }
</style>
</head>
<body>
  <h1 class="logo" aria-label="phasebook">
    <svg viewBox="0 0 1800 600" role="img" aria-labelledby="logoTitle" xmlns="http://www.w3.org/2000/svg">
      <title id="logoTitle">phasebook</title>
      <text x="0" y="340"
            fill="#ffffff"
            font-size="420"
            font-family="Arial Black, Impact, sans-serif"
            font-weight="900"
            letter-spacing="-16">phasebook</text>
    </svg>
  </h1>
</body>
</html>
