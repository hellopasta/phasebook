<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phasebook</title>
<link rel="icon" type="image/png" href="facebook.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #2d5191; }
  body { min-height: 100vh; color: #ffffff; }
  .logo {
    font-family: "Klavika", "Ubuntu", Arial, sans-serif;
    font-weight: 700;
    font-size: 47px;
    letter-spacing: 0;
    line-height: 1;
    margin: 0;
    padding: 2px 0 0 8px;
  }
  .message {
    font-family: "Marcellus", "Optima", "Candara", serif;
    font-size: 29px;
    line-height: 1.3;
    letter-spacing: 0.3px;
    width: 265px;
    margin: 40px 0 0 98px;
  }
  .discord-button {
    display: inline-block;
    box-sizing: border-box;
    margin: 0 0 0 98px;
    padding: 6px 12px;
    border: 2px solid;
    border-color: #ffffff #404040 #404040 #ffffff;
    background: #c0c0c0;
    color: #000000;
    font: 16px Arial, sans-serif;
    text-decoration: none;
    text-shadow: 1px 1px #ffffff;
    cursor: pointer;
  }
  .discord-button:hover { background: #d4d4d4; }
  .discord-button:active {
    border-color: #404040 #ffffff #ffffff #404040;
    padding: 7px 11px 5px 13px;
  }
  .discord-button:focus-visible { outline: 1px dotted #000000; outline-offset: -5px; }
</style>
</head>
<body>
  <h1 class="logo">phasebook</h1>
  <p class="message">aha, well well well, looks like ur not patient</p>
  <a class="discord-button" href="https://discord.gg/JMv22evyKM" target="_blank" rel="noopener noreferrer">Join Discord</a>
</body>
</html>
