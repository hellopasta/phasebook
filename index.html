<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phasebook</title>
<link rel="icon" type="image/png" href="phasebook.ico">
<style>
  :root {
    --bg: #31558f;
    --fg: #ffffff;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    min-height: 100vh;
    padding: 4px 7px 40px;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
  }

  .logo {
    display: block;
    width: min(220px, 52vw);
    height: auto;
  }

  .discord-button {
    display: inline-block;
    margin: 8px 8px 0 0;
    padding: 10px 16px;
    border: 2px solid var(--fg);
    border-radius: 4px;
    color: var(--fg);
    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    white-space: nowrap;
  }

  .discord-button:hover,
  .discord-button:focus-visible {
    background: var(--fg);
    color: var(--bg);
  }

  main {
    width: min(320px, calc(100% - 32px));
    margin: 45px auto 0;
  }

  .message {
    margin: 0;
    font-size: clamp(25px, 6vw, 32px);
    line-height: 1.22;
  }

  @media (max-width: 420px) {
    .page-header {
      align-items: center;
    }

    .discord-button {
      margin-right: 0;
      padding: 8px 10px;
      font-size: 13px;
    }

    main {
      margin-top: 42px;
    }
  }
</style>
</head>
<body>
  <header class="page-header">
    <img class="logo" src="Phasebook2.png" alt="phasebook">
    <a class="discord-button" href="https://discord.gg/JMv22evyKM" target="_blank" rel="noopener noreferrer">Join Discord</a>
  </header>
  <main>
    <p class="message">aha, well well well,<br>looks like ur not<br>patient</p>
  </main>
</body>
</html>
